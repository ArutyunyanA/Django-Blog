{% extends "blog/base.html" %}

{% block title %}Delete Comment{% endblock %}

{% block content %}
  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">

        <div class="card shadow-sm border-0">
          <div class="card-header bg-danger text-white d-flex align-items-center">
            <i class="bi bi-chat-dots-fill me-2"></i>
            <h5 class="mb-0">Delete Comment</h5>
          </div>
          <div class="card-body">
            <h5 class="card-title">Are you sure you want to delete this comment?</h5>
            <p class="card-text">
              <i class="bi bi-quote me-1 text-muted"></i>
              <em>{{ comment.body }}</em>
            </p>

            <form action="{% url 'blog:delete_comment' comment.id %}" method="post" class="d-flex justify-content-between mt-4">
              {% csrf_token %}
              <a href="{{ comment.post.get_absolute_url }}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Cancel
              </a>
              <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash-fill"></i> Yes, delete
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
{% endblock %}
