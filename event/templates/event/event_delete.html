{% extends "blog/base.html" %}

{% block title %}Delete Event{% endblock %}

{% block content %}
    <div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

        <div class="card shadow-sm border-0">
            <div class="card-header bg-danger text-white d-flex align-items-center">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <h5 class="mb-0">Delete Event</h5>
            </div>
            <div class="card-body">
            <h5 class="card-title">Are you sure?</h5>
            <p class="card-text">
                You are about to delete the event:  
                <strong>"{{ event.title }}"</strong>.
            </p>

            <form method="post" class="d-flex justify-content-between mt-4">
                {% csrf_token %}
                <a href="{% url 'event:event_details' event.id %}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Cancel
                </a>
                <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash-fill"></i> Yes, delete
                </button>
            </form>
            </div>
        </div>

        </div>
    </div>
    </div>
{% endblock %}
